name: NFL props -- collect past Kalshi prices (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'   # resumes until every past game is collected; quick no-op after that
permissions:
  contents: write
concurrency:
  group: kalshi-props-history
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect settled Kalshi NFL player props + pre-kickoff prices (no keys, nothing bet)
        env:
          MAX_MINUTES: '300'
        run: python3 nfl/kalshi_props_history_v1.py
      - name: Save progress
        if: always()
        run: |
          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nfl/props_history
          git diff --cached --quiet || git commit -m "Kalshi props history $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 7)); done
          exit 1
