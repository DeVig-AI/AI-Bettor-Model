name: Research Lab -- Inspector General

# The Inspector General (research/lab/inspector.py): the only code that downloads the sealed 2025 season (the exam)
# or current-season data (the paper season), and never into the repo. Rules: research/RESEARCH_LAB_CONSTITUTION.md.
#   review -- re-judge every candidate against the whole ledger (also runs after every lab run)
#   exam   -- spend ONE of the 3 sealed 2025 exams on the best current lab pass. Final; a crash still spends it.
#             The research loop hands over here (then_loop) when a sport has a lab pass and an exam left;
#             this queues the loop again when done (Constitution v8 A8).
#   paper  -- promoted models only: log picks at Kalshi prices before kickoff and grade finished games
# sport: NFL (Part B, sealed 2025), CFB (Part C, sealed 2025), or NBA / NHL / MLB (Part D, sealed 2021; their paper
# season starts when each sport's Kalshi logger is merged, D7). Scheduled runs do NFL every 3 hours and CFB once a
# day (CFB's live data costs CollegeFootballData calls; CFB_API_KEY is passed only to the CFB exam and paper steps).
on:
  schedule:
    - cron: '41 */3 * * *'   # paper season; exits at once while no model is promoted
  workflow_dispatch:
    inputs:
      action:
        description: 'review, paper, or exam (spends 1 of the 3 sealed exams on the best lab pass; final)'
        type: choice
        options: [review, paper, exam]
        default: review
      sport:
        description: 'NFL, CFB (college football), NBA, NHL or MLB'
        type: choice
        options: [NFL, CFB, NBA, NHL, MLB]
        default: NFL
      then_loop:
        description: 'Queue the research loop again when done (the loop sets this when it hands over for an exam)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write             # an exam handed over by the loop queues the loop again

concurrency:
  # scheduled paper-season checks get their own queue, so they can never bump a queued loop run
  group: ${{ github.event_name == 'schedule' && 'research-paper' || 'research-lab' }}
  cancel-in-progress: false

jobs:
  inspector:
    strategy:
      max-parallel: 1          # one sport at a time: both write research/status.json
      matrix:
        sport: ${{ fromJSON(format('["{0}"]', inputs.sport || 'NFL')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ACTION: ${{ inputs.action || 'paper' }}
      LAB_SPORT: ${{ matrix.sport }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main              # after a lab run: its pushed results, not the commit that started it

      - name: Anything to do?
        id: go
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%H)" = "15" ]; then
            echo "LAB_SPORT=CFB" >> "$GITHUB_ENV"; LAB_SPORT=CFB      # the once-a-day CFB paper slot (15:41 UTC; NFL takes the other seven)
          fi
          prom=research/promoted.json; [ "$LAB_SPORT" != "NFL" ] && prom="research/${LAB_SPORT,,}/promoted.json"
          if [ "$ACTION" = "paper" ] && ! grep -q '"state": "active"' "$prom" 2>/dev/null; then
            echo "No promoted model: nothing to paper-track."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.go.outputs.go == 'true'
        with:
          python-version: '3.13'

      - name: Install
        if: steps.go.outputs.go == 'true'
        run: pip install pandas==2.3.3 numpy==2.5.3 pyyaml==6.0.2

      - name: Restore the CFB data cache (private Actions cache; never committed, Constitution C1a)
        if: steps.go.outputs.go == 'true' && env.LAB_SPORT == 'CFB'
        uses: actions/cache/restore@v4
        with:
          key: cfb-data-none
          restore-keys: cfb-data-
          path: |
            research/cfb/data/games.csv
            research/cfb/data/lines.csv
            research/cfb/data/advanced.csv
            research/cfb/data/advanced_ngt.csv
            research/cfb/data/returning.csv
            research/cfb/current

      - name: Build the Part D lab cache from the pinned archive (2011-2020 only; never committed, Constitution D1)
        if: steps.go.outputs.go == 'true' && contains(fromJSON('["NBA","NHL","MLB"]'), env.LAB_SPORT)
        run: python3 -m research.lab.sbr_data fetch

      - name: Locked files unchanged
        if: steps.go.outputs.go == 'true'
        run: python3 tools/frozen_guard.py check

      - name: Review
        if: steps.go.outputs.go == 'true' && env.ACTION == 'review'
        run: python3 -m research.lab.inspector review

      - name: Exam -- record that one sealed exam is spent, and push that BEFORE any sealed data is downloaded
        if: steps.go.outputs.go == 'true' && env.ACTION == 'exam'
        run: |
          python3 -m research.lab.inspector exam-register
          research/lab/push.sh "Inspector General: sealed exam registered $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Exam -- download the sealed season (memory only) and score it
        if: steps.go.outputs.go == 'true' && env.ACTION == 'exam'
        env:
          CFB_API_KEY: ${{ env.LAB_SPORT == 'CFB' && secrets.CFB_API_KEY || '' }}
        run: python3 -m research.lab.inspector exam-run

      - name: Paper season
        if: steps.go.outputs.go == 'true' && env.ACTION == 'paper'
        env:
          CFB_API_KEY: ${{ env.LAB_SPORT == 'CFB' && secrets.CFB_API_KEY || '' }}
        run: python3 -m research.lab.inspector paper

      - name: Commit and push
        if: always() && steps.go.outputs.go == 'true'
        run: research/lab/push.sh "Inspector General ($LAB_SPORT $ACTION) $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Hand back to the research loop
        if: always() && inputs.then_loop && vars.RESEARCH_LOOP != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run research_lab.yml --ref main

