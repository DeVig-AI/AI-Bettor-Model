name: NHL / WNBA -- data probe (read-only, coverage only)
on:
  workflow_dispatch:
  push:
    branches: [nhl-wnba-probe]
    paths: ['.github/workflows/nhl_wnba_probe.yml', 'odds_probe/nhl_wnba_probe_v1.py']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.ref_name }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Probe Kalshi NHL/WNBA series, box scores, ESPN, NHL API (no prices, no keys, nothing bet)
        run: python3 odds_probe/nhl_wnba_probe_v1.py
      - name: Save
        if: always()
        run: |
          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add odds_probe/nhl_wnba_probe_v1.json odds_probe/nhl_wnba_probe_v1.md
          git diff --cached --quiet && exit 0
          git commit -q -m "NHL / WNBA data probe $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done
          exit 1
