name: NFL open models -- DeVig next to published open-source models (comparison only)
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'   # hourly: each model's latest number before kickoff; public data only, no keys, nothing bet
permissions:
  contents: write
concurrency:
  group: nfl-open-models
  cancel-in-progress: false   # never drop a snapshot run half-way
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Snapshot every model's pick, grade finished games, write the app's file
        run: python3 nfl/open_models_v1.py snapshot export
      - name: Save it
        run: |
          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in nfl/open_models/snapshots.jsonl nfl/open_models_export.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && exit 0
          git commit -q -m "NFL open models $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
