name: Research stats -- power rankings, team and player stats (display only)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11,17 * * *'   # twice a day: box scores are published the morning after games; public data only
permissions:
  contents: write
concurrency:
  group: research-stats
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - name: NBA (ESPN box scores via sportsdataverse)
        run: python3 tools/stats_nba.py
      - name: NHL (the props model's box scores + final scores from the NHL API)
        run: python3 tools/stats_nhl.py
      - name: NFL (nflverse weekly stats and schedule)
        run: python3 tools/stats_nfl.py
      - name: WNBA (ESPN box scores via sportsdataverse)
        run: python3 tools/stats_wnba.py
      # College football: ESPN, this season only (the 2025 season is sealed for the research lab). Finished games' box
      # scores never change, so they stay in the private Actions cache and each run fetches only new ones.
      - name: Restore the college football box scores
        uses: actions/cache/restore@v4
        with:
          key: cfb-espn-none
          restore-keys: cfb-espn-
          path: .cache/cfb-espn
      - name: College football (ESPN scoreboards, box scores and rosters)
        env:
          CFB_ESPN_CACHE: .cache/cfb-espn
        run: python3 tools/stats_cfb.py
      - name: Keep the college football box scores
        if: always() && hashFiles('.cache/cfb-espn/**') != ''
        uses: actions/cache/save@v4
        with:
          key: cfb-espn-${{ github.run_id }}
          path: .cache/cfb-espn
      - name: Save them
        run: |
          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats
          git diff --cached --quiet && exit 0
          git commit -q -m "Research stats $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 7)); done
          exit 1
