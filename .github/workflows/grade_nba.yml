name: NBA picks and grading

on:
  schedule:
    - cron: '0 */3 * * *'   # grade every 3 hours
    - cron: '0 15 * * *'    # lock picks once a day, 11am ET
    - cron: '0 16 * * *'    # backup lock runs (CHAMPION_CHALLENGER_V6_PREREG.md): noon and 1pm ET, only when no lock
    - cron: '0 17 * * *'    #   run has happened yet that day (GitHub sometimes skips a scheduled run)
  workflow_dispatch: {}      # manual run does both

permissions:
  contents: write

concurrency:
  group: nba-db              # never let two runs write the database at once
  cancel-in-progress: false

jobs:
  nba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install certifi pandas numpy scikit-learn pdfplumber

      - name: Put the season files where the scripts expect them
        run: ln -sfn "$GITHUB_WORKSPACE/nba" "$GITHUB_WORKSPACE/data"

      - name: Grade picks
        working-directory: nba
        run: python3 nba_live_tracker_grade_results.py

      - name: Decide whether this run locks picks
        id: mode
        run: |
          # the day's first lock run locks (V6); a manual run always does. nba/NBA_LOCK_RUNS.txt lists the Eastern dates
          # a lock run finished on.
          today=$(TZ=America/New_York date +%F)
          done_today=false
          if [ -f nba/NBA_LOCK_RUNS.txt ] && grep -qx "$today" nba/NBA_LOCK_RUNS.txt; then done_today=true; fi
          case "${{ github.event.schedule }}" in
            '0 15 * * *'|'0 16 * * *'|'0 17 * * *') sched_lock=true ;;
            *) sched_lock=false ;;
          esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "lock=true" >> "$GITHUB_OUTPUT"
          elif [ "$sched_lock" = true ] && [ "$done_today" = false ]; then
            echo "lock=true" >> "$GITHUB_OUTPUT"
          else
            [ "$sched_lock" = true ] && echo "Today's ($today) lock run already happened: this backup run only grades."
            echo "lock=false" >> "$GITHUB_OUTPUT"
          fi
          echo "today=$today" >> "$GITHUB_OUTPUT"

      - name: Fetch live odds (Kalshi public prices, free, no key)
        id: odds
        if: steps.mode.outputs.lock == 'true'
        working-directory: nba
        run: |
          set +e
          python3 nba_fetch_odds_kalshi.py --out live/NBA_ODDS_LIVE.csv --hours-ahead 72 > "$RUNNER_TEMP/odds.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/odds.log"
          if [ $rc -eq 0 ]; then
            echo "have_games=true" >> "$GITHUB_OUTPUT"
          elif grep -q "No odds rows in the next" "$RUNNER_TEMP/odds.log"; then
            echo "No NBA games with posted odds in the next 72 hours -- nothing to lock today."
            echo "have_games=false" >> "$GITHUB_OUTPUT"
          else
            echo "Odds fetch failed for a reason other than 'no games' -- stopping so it gets noticed."
            exit $rc
          fi

      # Model C + injuries (CHAMPION_CHALLENGER_V5_PREREG.md) reads each team's last 10 box scores from ESPN; finished
      # games never change, so they are kept between runs
      - name: Restore ESPN box scores
        if: steps.odds.outputs.have_games == 'true'
        uses: actions/cache@v4
        with:
          path: nba/espn_raw_nba/summary
          key: nba-summary-${{ github.run_id }}
          restore-keys: nba-summary-

      - name: Check the live injury-report reader against the tested one
        if: steps.odds.outputs.have_games == 'true'
        run: python3 -m unittest -v tests/tools/test_nba_injury_parsers.py

      - name: Lock picks (Model C + injuries, game-day games only)
        id: lock
        if: steps.odds.outputs.have_games == 'true'
        working-directory: nba
        run: python3 nba_live_tracker_lock_v2.py --odds live/NBA_ODDS_LIVE.csv

      - name: Note that today's lock run happened (the backup runs then stand down)
        if: steps.mode.outputs.lock == 'true' && steps.odds.outcome == 'success' && (steps.odds.outputs.have_games != 'true' || steps.lock.outcome == 'success')
        run: |
          f=nba/NBA_LOCK_RUNS.txt
          touch "$f"
          grep -qx "${{ steps.mode.outputs.today }}" "$f" || echo "${{ steps.mode.outputs.today }}" >> "$f"

      - name: Export the app's NBA games (locked picks and results)
        if: always()
        working-directory: nba
        run: python3 export_lineboard_nba_v2.py

      - name: Commit and push if the database changed
        if: always()           # keep any grading/locking that succeeded even if a later step failed
        run: |
          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/NBA_PROSPECTIVE_TRACKER_V1.sqlite3
          if [ -f nba/NBA_LOCK_RUNS.txt ]; then git add nba/NBA_LOCK_RUNS.txt; fi
          if [ -f nba/lineboard_export.json ]; then git add nba/lineboard_export.json; fi
          git diff --cached --quiet || git commit -m "NBA automated run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # another bot may have pushed since checkout: rebase onto it and retry. A conflict aborts the rebase and fails the
          # step (never a half-rebased push); the step only passes once the results are on main.
          for i in 1 2 3; do
            if git pull --rebase --autostash -q; then
              git push -q && exit 0
            else
              git rebase --abort 2>/dev/null || true
              echo "::warning::git pull --rebase failed (try $i)"
            fi
            sleep $((i * 5))
          done
          echo "::error::could not push the results after 3 tries"
          exit 1
