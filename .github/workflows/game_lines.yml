name: Game lines -- every Kalshi spread for both teams (display only)
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'   # twice an hour; public prices only, no keys, nothing bet
permissions:
  contents: write
concurrency:
  group: game-lines
  cancel-in-progress: true
jobs:
  lines:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the lines file (Kalshi spreads for NFL, NBA and MLB)
        run: python3 tools/game_lines.py
      - name: Save it
        run: |
          [ -f live/game_lines.json ] || exit 0
          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live/game_lines.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Game lines $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
