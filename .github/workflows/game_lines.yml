name: Game lines -- every Kalshi spread for both teams (display only)
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'   # twice an hour; public prices only, no keys, nothing bet
permissions:
  contents: write
concurrency:
  group: game-lines
  cancel-in-progress: true
jobs:
  lines:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the lines file (Kalshi spreads for NFL, NBA, MLB, NHL, WNBA and college football)
        run: python3 tools/game_lines.py
      - name: Polymarket's prices for the same games (public, no key)
        run: python3 tools/poly_lines.py || echo "poly_lines failed; the Kalshi file is still saved"
      - name: Save it
        run: |
          [ -f live/game_lines.json ] || exit 0
          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live/game_lines.json
          if [ -f live/poly_lines.json ]; then git add live/poly_lines.json; fi
          if [ -f live/cfb_history.json ]; then git add live/cfb_history.json; fi
          git diff --cached --quiet && exit 0
          git commit -q -m "Game lines $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
      - name: Send DeVig alerts that are due (functions/api/alerts.js; fine if alerts aren't set up yet)
        if: always()
        env:
          RUN_KEY: ${{ secrets.ALERTS_RUN_KEY }}
        run: |
          curl -sS -m 55 -X POST -H "x-run-key: $RUN_KEY" "https://devigai.pages.dev/api/alerts?run=1" || true
