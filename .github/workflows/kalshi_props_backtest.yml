name: NFL props -- Kalshi back-test (pre-registered, run on demand)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kalshi-props-history      # never overlaps the history collector
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pandas + numpy
        run: pip install pandas numpy
      - name: Finish collecting past Kalshi prices (live + archived markets; no keys, nothing bet)
        env:
          MAX_MINUTES: '120'
        run: python3 nfl/kalshi_props_history_v1.py
      - name: Run the pre-registered back-test (NFL_PROPS_KALSHI_BACKTEST_V1)
        run: python3 nfl/kalshi_props_backtest_v1.py
      - name: Save data and results
        if: always()
        run: |
          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nfl/props_history
          git diff --cached --quiet && exit 0
          git commit -q -m "Kalshi props back-test $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
