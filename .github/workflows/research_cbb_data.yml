name: Research CBB -- data (ESPN, history once)

# Fills the lab's men's college basketball cache, research/cbb/data/ (seasons 2015-2025 only; 2026 is sealed and never
# stored), fetching only seasons it does not have yet: ESPN's public Division I scoreboard for every day from November 1
# to April 15, then each Division I game's odds list (Constitution Part E1; no key). A run stops starting new seasons
# after CBB_FETCH_MINUTES; the rest is fetched by the next run. The data itself is never committed (E1: ESPN's data is
# not republished here): it lives in this repo's private Actions cache. Only MANIFEST.json (each season's fingerprint
# and counts) is committed; a refetched season must match it, or the lab refuses to run.
on:
  schedule:
    - cron: '47 10 * * 2'    # Tuesdays 6:47am ET: a no-op once every season is cached
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-lab        # never at the same time as the lab or the Inspector General
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CBB_FETCH_MINUTES: '150'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install
        run: pip install pandas==2.3.3 numpy==2.5.3 pyyaml==6.0.2

      - name: Locked files unchanged (the Constitution must be locked before any CBB data is touched)
        run: python3 tools/frozen_guard.py check

      - name: Restore the CBB data cache (private Actions cache; never committed, Constitution E1)
        uses: actions/cache/restore@v4
        with:
          key: cbb-data-none
          restore-keys: cbb-data-
          path: research/cbb/data/*.csv

      - name: Lab cache -- fetch only missing seasons (2015-2025)
        run: python3 -m research.lab.cbb_data fetch

      - name: Save the CBB data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          key: cbb-data-${{ github.run_id }}
          path: research/cbb/data/*.csv

      - name: Commit and push (MANIFEST.json only; the data files are git-ignored)
        if: always()
        run: research/lab/push.sh "Research CBB data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
