name: Exchange markets probe (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check what Kalshi and Polymarket list for NFL/NBA/MLB (read-only, no keys)
        run: python3 exchange_markets_probe_v1.py
      - name: Save the result
        run: |
          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add odds_probe/exchange_markets_probe.json odds_probe/exchange_markets_probe.md
          git diff --cached --quiet || git commit -m "Exchange markets probe $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase -q && git push
