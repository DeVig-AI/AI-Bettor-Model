name: Exchange markets probe (Kalshi + Polymarket, one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read open NFL/NBA/MLB markets from the public Kalshi and Polymarket APIs (no keys, read-only)
        run: python3 exchange_markets_probe_v1.py
      - name: Save the result
        run: |
          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add odds_probe/exchange_markets_probe.json odds_probe/exchange_markets_probe.md
          git diff --cached --quiet || git commit -m "Exchange markets probe $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 7)); done
          exit 1
