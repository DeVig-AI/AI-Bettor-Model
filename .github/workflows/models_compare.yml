name: Models page -- DeVig next to published open-source models (comparison only)
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'   # hourly: each model's latest number before the game; public data only, no keys, nothing bet
permissions:
  contents: write
concurrency:
  group: models-compare
  cancel-in-progress: false   # never drop a run half-way: it moves picks into the append-only file
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Lab models' packages (pinned, as the Research Lab uses)
        run: pip install pandas==2.3.3 numpy==2.5.3 pyyaml==6.0.2
      - name: Restore the CFB data cache (read-only here; never committed, Constitution C1a)
        uses: actions/cache/restore@v4
        with:
          key: cfb-data-none
          restore-keys: cfb-data-
          path: |
            research/cfb/data/games.csv
            research/cfb/data/lines.csv
            research/cfb/data/advanced.csv
            research/cfb/data/advanced_ngt.csv
            research/cfb/data/returning.csv
            research/cfb/current
      - name: DeVig Lab models, NHL and CFB (tools/lab_live.py -> live/lab/; new, not proven)
        continue-on-error: true   # the Lab's numbers are extra: the scoreboard runs without them
        run: python3 tools/lab_live.py
      - name: DeVig's own NHL model v1 (tools/nhl_model_live.py -> live/devig/nhl.json; nhl/NHL_MODEL_V1_PREREG.md)
        continue-on-error: true   # the scoreboard runs without it (its last file goes stale after 12 h and is not read)
        run: python3 tools/nhl_model_live.py
      - name: DeVig's CFB model v1, a challenger (tools/cfb_model_live.py -> live/devig/cfb.json; cfb/CFB_MODEL_V1_PREREG.md)
        continue-on-error: true   # the scoreboard runs without it
        run: python3 tools/cfb_model_live.py
      - name: DeVig's CBB model v1, a challenger (tools/cbb_model_live.py -> live/devig/cbb.json; cbb/CBB_MODEL_V1_PREREG.md)
        continue-on-error: true   # the scoreboard runs without it
        run: python3 tools/cbb_model_live.py
      - name: DeVig Soccer v1, the SOCCER.ml champion (tools/soccer_model_live.py -> live/devig/soccer.json; soccer/SOCCER_MODEL_V1_PREREG.md)
        continue-on-error: true   # the scoreboard runs without it
        run: python3 tools/soccer_model_live.py
      - name: Lock and grade the SOCCER.ml slot (tools/soccer_track.py; CHAMPION_CHALLENGER_V4_PREREG.md)
        continue-on-error: true
        run: python3 tools/soccer_track.py
      - name: Restore the Narrative model's college caches (ESPN college data is never committed, Constitution E1)
        uses: actions/cache/restore@v4
        with:
          key: narrative-${{ github.run_id }}
          restore-keys: narrative-
          path: .cache/narrative
      - name: Narrative model, all sports (tools/narrative.py -> live/narrative/; how the experts reason, not proven)
        continue-on-error: true   # extra: never used for DeVig's own picks
        timeout-minutes: 6
        run: python3 tools/narrative.py
      - name: Save the Narrative model's college caches
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          key: narrative-${{ github.run_id }}
          path: .cache/narrative
      - name: Read every model's pick, lock started games, grade finals, write the app's file
        run: python3 tools/models_compare.py
      - name: Champion / challenger review (CHAMPION_CHALLENGER_V1_PREREG.md)
        continue-on-error: true   # a review failure must not stop the scoreboard's own data from being saved
        run: python3 tools/champion_review.py
      - name: DeVig's college picks (CHAMPION_CHALLENGER_V3_PREREG.md; tools/college_picks.py -> cbb/, cfb/lineboard_export.json)
        continue-on-error: true   # the scoreboard runs without them
        run: |
          python3 tools/college_picks.py cfb-tiers   # once: CFB v1's tiers from 2021-24 (needs the cache); never rewritten
          python3 tools/college_picks.py
      - name: Re-export the app's NBA games (a challenger on trial is locked up to an hour after DeVig's tracker)
        continue-on-error: true
        run: |
          # only while an NBA challenger is on trial or was kept; otherwise grade_nba.yml's export is the only one
          if python3 -c "import json,sys; s=json.load(open('live/champions.json'))['slots']['NBA.ml']; sys.exit(0 if s.get('trial') or s['champion'] != 'devig' else 1)"; then
            (cd nba && python3 export_lineboard_nba_v2.py)
          fi
      - name: Save it
        run: |
          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in live/models/latest.json live/models/picks.jsonl live/models/results.jsonl live/models_export.json \
                   live/champions.json live/champions/MODEL_LOCKS.csv live/champions/DECISIONS.csv live/champions_export.json \
                   nba/lineboard_export.json cbb/lineboard_export.json cfb/lineboard_export.json cfb/cfb_v1_tiers.json \
                   live/lab/nhl.json live/lab/cfb.json live/devig/nhl.json live/devig/cfb.json live/devig/cbb.json \
                   live/devig/soccer.json live/devig/soccer_locks.json live/devig/soccer_record.json \
                   live/narrative/nba.json live/narrative/games.json live/narrative/nhl.json live/narrative/nhl_games.json \
                   live/narrative/nfl.json live/narrative/nfl_games.json live/narrative/cfb.json live/narrative/cbb.json \
                   live/narrative/mlb.json live/narrative/mlb_games.json live/narrative/wnba.json live/narrative/wnba_games.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -q -m "Models page $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
      - name: Send DeVig alerts that are due (functions/api/alerts.js; fine if alerts aren't set up yet)
        if: always()
        env:
          RUN_KEY: ${{ secrets.ALERTS_RUN_KEY }}
        run: |
          curl -sS -m 55 -X POST -H "x-run-key: $RUN_KEY" "https://devigai.pages.dev/api/alerts?run=1" || true
