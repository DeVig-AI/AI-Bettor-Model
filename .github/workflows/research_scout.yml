name: Research Lab -- scout (what changed in outside models and analytics, for the daily researcher)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'   # daily, before the researcher (8:47 New York time)
permissions:
  contents: write
concurrency:
  group: research-scout
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: Check every source in research/scout/SOURCES.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/scout_sources.py
      - name: Save
        run: |
          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/scout/WHATS_NEW.md research/scout/STATE.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Research Lab scout $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 7)); done
          exit 1
