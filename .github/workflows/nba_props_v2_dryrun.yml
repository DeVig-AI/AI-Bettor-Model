name: NBA props v2 -- dry run (temporary check; writes nothing)
on:
  push:
    branches: [nba-props-v2]
    paths: ['.github/workflows/nba_props_v2_dryrun.yml']
permissions:
  contents: read
jobs:
  dry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scipy lightgbm
      - name: Pull NBA player-prop prices from Kalshi's public API
        run: python3 nba/nba_props_exchanges_v1.py
      - name: Score with v2, dry run (no lock, no log, no export)
        run: python3 nba/nba_props_model_v2_live.py --dry-run
