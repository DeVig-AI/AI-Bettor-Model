name: NFL props live -- scores, pick progress, Kalshi now (display only)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'   # quick no-op outside game windows; public data only, no keys, nothing bet
permissions:
  contents: write
concurrency:
  group: nfl-props-live
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the live file (ESPN scores + box scores, Kalshi prices for locked paper picks)
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python3 nfl/nfl_props_live_v1.py
      - name: Save it
        run: |
          [ -f nfl/live/props_live.json ] || exit 0
          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nfl/live/props_live.json
          [ -f nfl/live/props_results.json ] && git add nfl/live/props_results.json
          [ -f nfl/live/props_lines.json ] && git add nfl/live/props_lines.json
          git diff --cached --quiet && exit 0
          git commit -q -m "NFL props live $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
