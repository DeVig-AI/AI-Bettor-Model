name: NFL Model 2.0 -- live paper test (Model 1.0 + injuries; the app's picks stay on Model 1.0)
on:
  workflow_dispatch:
  schedule:
    - cron: '41 */3 * * *'   # every 3 hours: the coming week's forecasts with the latest injury reports and rosters
    - cron: '5 16 * * 0'     # Sunday noon ET: after the early games' inactives
    - cron: '25 19 * * 0'    # Sunday 3:25pm ET: after the late games' inactives
permissions:
  contents: write
concurrency:
  group: nfl-db              # shares the NFL app file with the NFL picks workflow: never both at once
  cancel-in-progress: false
jobs:
  model2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the versions Model 1.0 was built with
        run: pip install pandas==2.3.3 numpy==2.5.3 scikit-learn==1.9.1 joblib==1.6.0 pyarrow==25.0.1
      - name: Past seasons' play-by-play (never changes)
        uses: actions/cache@v4
        with:
          path: research/injuries/.cache
          key: nfl-model2-history-v1
      - name: Forecast the coming week
        run: python3 nfl/model2/nfl_model2_v1.py live
      - name: Explain each game's number (home field, form, who is out) for the app
        # read-only next to the locked model; if it fails, the forecasts still save
        run: python3 nfl/model2/explain_v1.py || echo "::warning::explainer failed"
      - name: Save (the app file is rebuilt on top of the latest main, so it never conflicts)
        run: |
          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nfl/model2/upcoming.json nfl/model2/MODEL2_LIVE_LOG.jsonl nfl/model2/why.json 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "NFL Model 2.0 forecasts $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git checkout -q -- nfl/lineboard_export.json 2>/dev/null || true
          for i in 1 2 3 4 5; do
            # only this bot writes nfl/model2/, so this rebase can't conflict; other NFL bots also write the app file,
            # so it is regenerated after the pull instead of being rebased
            if ! git pull --rebase -q; then git rebase --abort 2>/dev/null || true; sleep $((i * 7)); continue; fi
            base=$(git rev-parse HEAD)
            (cd nfl && python3 export_lineboard_nfl_v8.py)
            git add nfl/lineboard_export.json
            git diff --cached --quiet || git commit -q -m "NFL app export (Model 2.0) $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push -q && exit 0
            git reset -q --hard "$base"            # drop the app-file commit; rebuild it after the next pull
            sleep $((i * 7))
          done
          exit 1
      - name: Send DeVig alerts that are due (functions/api/alerts.js; fine if alerts aren't set up yet)
        if: always()
        env:
          RUN_KEY: ${{ secrets.ALERTS_RUN_KEY }}
        run: |
          curl -sS -m 55 -X POST -H "x-run-key: $RUN_KEY" "https://devigai.pages.dev/api/alerts?run=1" || true
