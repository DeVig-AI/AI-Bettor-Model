name: DeVig apps -- build Mac, Windows, Android and iPhone downloads
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: devig-apps
  cancel-in-progress: false
env:
  ICON_ARGS: "--iconBackgroundColor #0c0f14 --iconBackgroundColorDark #0c0f14 --splashBackgroundColor #0c0f14 --splashBackgroundColorDark #0c0f14"
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Electron and the packager
        run: npm install --no-audit --no-fund
      - name: Build the Mac app (Apple silicon + Intel)
        if: matrix.target == 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run dist:mac
          APP=$(find dist -maxdepth 2 -name 'DeVig.app' | head -1)
          echo "built $APP"
          # unsigned apps are refused on Apple silicon; an ad-hoc signature lets them run after the user approves them
          codesign --force --deep --sign - "$APP"
          mkdir -p out
          hdiutil create -volname DeVig -srcfolder "$APP" -ov -format UDZO out/DeVig-mac.dmg
          ditto -c -k --keepParent "$APP" out/DeVig-mac.zip
      - name: Build the Windows installer
        if: matrix.target == 'win'
        run: |
          npm run dist:win
          mkdir -p out
          cp dist/*.exe out/DeVig-Setup-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: devig-${{ matrix.target }}
          path: desktop/out/*
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create the Android project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
      - name: App icons
        continue-on-error: true
        run: npx @capacitor/assets generate --android $ICON_ARGS
      - name: Build the APK (debug-signed, installs directly)
        run: |
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
          mkdir -p ../out && cp app/build/outputs/apk/debug/app-debug.apk ../out/DeVig-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: devig-android
          path: mobile/out/*
          if-no-files-found: error
  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Create the iPhone project
        run: |
          npm install --no-audit --no-fund
          npx cap add ios
      - name: App icons
        continue-on-error: true
        run: npx @capacitor/assets generate --ios $ICON_ARGS
      - name: Build the unsigned IPA (re-signed by AltStore / Sideloadly when installed)
        run: |
          npx cap sync ios
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -25
          APP=build/Build/Products/Release-iphoneos/App.app
          test -d "$APP"
          mkdir -p out/Payload && cp -R "$APP" out/Payload/
          (cd out && zip -qr DeVig-iphone.ipa Payload && rm -rf Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: devig-ios
          path: mobile/out/*
          if-no-files-found: error
  release:
    needs: [desktop, android, ios]
    if: always() && (needs.desktop.result == 'success' || needs.android.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the downloads on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.${{ github.run_number }}
          name: DeVig apps 1.${{ github.run_number }}
          make_latest: true
          files: out/*
          body: |
            DeVig for Mac, Windows, Android and iPhone. Every app opens the hosted DeVig site, so app updates arrive on their own; a new download is only needed when the app shell itself changes.

            **Mac:** open `DeVig-mac.dmg` and drag DeVig to Applications. The first time, right-click DeVig and choose **Open**, then **Open** again. If macOS says it is damaged, run `xattr -cr /Applications/DeVig.app` in Terminal once.

            **Windows:** run `DeVig-Setup-windows.exe`. If SmartScreen appears, click **More info**, then **Run anyway**.

            **Android:** download `DeVig-android.apk` on the phone and open it. Allow installs from your browser or Files app when asked.

            **iPhone:** sideload `DeVig-iphone.ipa` with AltStore or Sideloadly using your Apple ID. With a free Apple ID the app must be refreshed every 7 days (AltStore can do it automatically).

            None of the apps are signed with paid certificates. Paper test data only; nothing is bet.
