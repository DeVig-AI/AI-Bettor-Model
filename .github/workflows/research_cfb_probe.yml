name: Research CFB -- one-off probe (provider, limits, Kalshi tickers, licenses)

# Runs research/cfb/probe.py: one CFBD /info call plus four one-season schema samples (the key is never printed),
# Kalshi's NCAA football series, ESPN's college-football scoreboard, and open-model licenses. Read-only; commits nothing.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - research/cfb/probe.py
      - .github/workflows/research_cfb_probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Probe
        env:
          CFB_API_KEY: ${{ secrets.CFB_API_KEY }}
        run: python3 research/cfb/probe.py
