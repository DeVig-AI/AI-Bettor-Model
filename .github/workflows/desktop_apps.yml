name: DeVig desktop apps -- build Mac and Windows downloads
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-apps
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Electron and the packager
        run: npm install --no-audit --no-fund
      - name: Build the Mac app (Apple silicon + Intel)
        if: matrix.target == 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run dist:mac
          APP=$(find dist -maxdepth 2 -name 'DeVig.app' | head -1)
          echo "built $APP"
          # unsigned apps are refused on Apple silicon; an ad-hoc signature lets them run after the user approves them
          codesign --force --deep --sign - "$APP"
          mkdir -p out
          hdiutil create -volname DeVig -srcfolder "$APP" -ov -format UDZO out/DeVig-mac.dmg
          ditto -c -k --keepParent "$APP" out/DeVig-mac.zip
      - name: Build the Windows installer
        if: matrix.target == 'win'
        run: |
          npm run dist:win
          mkdir -p out
          cp dist/*.exe out/DeVig-Setup-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: devig-${{ matrix.target }}
          path: desktop/out/*
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the downloads on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.${{ github.run_number }}
          name: DeVig desktop 1.${{ github.run_number }}
          make_latest: true
          files: out/*
          body: |
            DeVig for Mac and Windows. The app opens the hosted DeVig site, so app updates arrive on their own; you only need a new download if the desktop shell itself changes.

            **Mac:** download `DeVig-mac.dmg`, open it and drag DeVig to Applications. The first time, right-click DeVig and choose **Open**, then **Open** again (it isn't signed with a paid Apple developer certificate). If macOS says the app is damaged, run `xattr -cr /Applications/DeVig.app` in Terminal once.

            **Windows:** download `DeVig-Setup-windows.exe` and run it. If Windows SmartScreen appears, click **More info**, then **Run anyway** (it isn't signed with a paid certificate).

            Paper test data only. Nothing is bet.
