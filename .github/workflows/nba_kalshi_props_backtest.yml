name: NBA props -- Kalshi back-test (pre-registered; collect past prices, then run once)
on:
  workflow_dispatch:
  push:
    branches: [nba-kalshi-props-backtest-v1]
    paths: ['.github/workflows/nba_kalshi_props_backtest.yml']
permissions:
  contents: write
concurrency:
  group: nba-kalshi-props-history
  cancel-in-progress: false
env:
  SAVE: |
    git config user.name "sports-tracker-bot"
    git config user.email "actions@users.noreply.github.com"
    git add nba/props_history
    git diff --cached --quiet && exit 0
    git commit -q -m "$MSG $(date -u +%Y-%m-%dT%H:%M:%SZ)"
    for i in 1 2 3 4; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i * 5)); done
    exit 1
jobs:
  # Collection resumes where the last job stopped (done_events.txt), so several jobs in a row cover a long history
  # without hitting GitHub's 6-hour job limit. A job finds nothing left to do and ends in a minute once it is complete.
  collect1:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.ref_name }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Collect settled Kalshi NBA player props + pre-tip-off prices (no keys, nothing bet; short first job = re-run for events with no markets)
        env: {MAX_MINUTES: '320'}
        run: python3 nba/kalshi_props_history_v1.py
      - name: Save progress
        if: always()
        env: {MSG: NBA Kalshi props history}
        run: bash -c "$SAVE"
  collect2:
    needs: collect1
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.ref_name }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - env: {MAX_MINUTES: '320'}
        run: python3 nba/kalshi_props_history_v1.py
      - if: always()
        env: {MSG: NBA Kalshi props history}
        run: bash -c "$SAVE"
  collect3:
    needs: collect2
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.ref_name }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - env: {MAX_MINUTES: '320'}
        run: python3 nba/kalshi_props_history_v1.py
      - if: always()
        env: {MSG: NBA Kalshi props history}
        run: bash -c "$SAVE"
  collect4:
    needs: collect3
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.ref_name }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - env: {MAX_MINUTES: '320'}
        run: python3 nba/kalshi_props_history_v1.py
      - if: always()
        env: {MSG: NBA Kalshi props history}
        run: bash -c "$SAVE"
  collect5:
    needs: collect4
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.ref_name }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - env: {MAX_MINUTES: '320'}
        run: python3 nba/kalshi_props_history_v1.py
      - if: always()
        env: {MSG: NBA Kalshi props history}
        run: bash -c "$SAVE"
  collect6:
    needs: collect5
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.ref_name }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - env: {MAX_MINUTES: '320'}
        run: python3 nba/kalshi_props_history_v1.py
      - if: always()
        env: {MSG: NBA Kalshi props history}
        run: bash -c "$SAVE"
  backtest:
    needs: collect6
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.ref_name }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy
      - name: Collection must be complete (the prereg uses every settled market)
        run: |
          python3 -c "import json,sys; s=json.load(open('nba/props_history/kalshi_props_history_v1_summary.json'))['stats']; print(s); sys.exit(0 if s.get('complete') and not s.get('no_markets') else 'collection not complete (or events with no markets): run the workflow again')"
      - name: Run the pre-registered back-test (NBA_PROPS_KALSHI_BACKTEST_V1)
        run: python3 nba/kalshi_props_backtest_v1.py
      - name: Save results
        if: always()
        env: {MSG: NBA Kalshi props back-test}
        run: bash -c "$SAVE"
