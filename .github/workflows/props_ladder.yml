name: Props ladder + same-game pairs -- rebuild past hit rates (daily, descriptive)
on:
  workflow_dispatch:
  schedule:
    - cron: '41 11 * * *'   # daily, after the night's games are graded by the NBA / NHL props bots
permissions:
  contents: write
concurrency:
  group: props-ladder
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild stats/props_ladder.json from saved history + the live bots' graded rungs (no keys)
        run: python3 tools/props_ladder_history.py
      - run: pip install numpy
      - name: Rebuild stats/props_samegame.json (same-game prop pairs vs their chances multiplied)
        run: python3 tools/props_samegame_history.py
      - name: Rebuild stats/props_streaks.json (past 10-game prop streaks vs Kalshi's price)
        run: python3 tools/props_streak_history.py
      - name: Save
        run: |
          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats/props_ladder.json stats/props_samegame.json stats/props_streaks.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Props ladder rebuild $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 7)); done
          exit 1
