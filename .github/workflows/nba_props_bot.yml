name: NBA props bot -- prices + model (paper only)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'   # every 2 hours; public market data only, no keys, nothing bet
permissions:
  contents: write
concurrency:
  group: nba-props-bot
  cancel-in-progress: false
jobs:
  props:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Keep past seasons' box scores between runs (the current season is re-downloaded every run)
        uses: actions/cache@v4
        with:
          path: nba/.box_cache
          key: nba-box-${{ github.run_id }}
          restore-keys: nba-box-
      - name: Install pandas, numpy, scipy, lightgbm
        run: pip install pandas numpy scipy lightgbm
      - name: Pull NBA player-prop prices from Kalshi's public API
        run: python3 nba/nba_props_exchanges_v1.py
      - name: Score props with the frozen v2 model, paper-lock, grade (v1's live test closed 2026-10-22)
        continue-on-error: true
        run: python3 nba/nba_props_model_v2_live.py
      - name: v3 shadow -- lock v3's chances next to v2 (no picks; NBA_PROPS_MODEL_V3_SHADOW)
        continue-on-error: true
        run: python3 nba/nba_props_model_v3_shadow.py
      - name: Explain v2's expected numbers for the app (read-only; nba/props_why.json)
        continue-on-error: true
        run: python3 nba/nba_props_explain_v2.py
      - name: Save the exports and the paper log
        if: always()
        run: |
          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f nba/props_exchanges_export.json ] && git add nba/props_exchanges_export.json
          [ -f nba/props_model_export.json ] && git add nba/props_model_export.json
          [ -f nba/props_why.json ] && git add nba/props_why.json
          [ -f nba/NBA_PROPS_MODEL_V2_LOG.sqlite3 ] && git add nba/NBA_PROPS_MODEL_V2_LOG.sqlite3
          [ -f nba/NBA_PROPS_MODEL_V3_SHADOW_LOG.sqlite3 ] && git add nba/NBA_PROPS_MODEL_V3_SHADOW_LOG.sqlite3
          git diff --cached --quiet || git commit -m "NBA props prices + model $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 7)); done
          exit 1
