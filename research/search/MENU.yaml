# Research Lab search menu, NFL (Constitution v8 A3.3c). Every round scores, in this order, up to
# search.max_new_per_round configurations not scored before: the grid below (all combinations, in order), then
# the neighbours of the 30 best per market (one setting one step along its ladder), then samples
# weighted by what past rounds learned, then uniform samples (both seeded by round), then blends of the best.
# Adding a value or a family here is how an idea joins the search: free, since search scores are not attempts.
# No known betting angles (A3.5).
families:
- name: Elo
  type: elo
  market: spread
  fixed:
    mean: 1505
    elo_per_point: 25
    playoff_mult: 1.0
    bye_rest_days: 13
    hfa_seasons: 3
    qb_alpha: 0.1
    qb_elo_per_value: 3.3
    qb_new_below_avg: 10
    nfelo_log_base: 10
    hfa_elo: 65
    revert_center: none
  grid:
    k:
    - 10
    - 15
    - 20
    - 25
    - 30
