# Research Lab signal library, NFL (Constitution v9 A3.3e). Each signal is tested by the search on top of the
# menu's signal_bases (alone, then in pairs and trios of the best), weights fit on the training seasons only.
# Allowed: kind team (columns: plays, epa, pass_plays, pass_epa, early_plays, early_epa, succ, noto_plays, noto_epa, comp_plays, comp_epa, top_seconds, points), schedule (rest_diff, travel_diff, div_game, off_bye_diff, short_week_diff), qb_change, injury (qb_out, reg_out, reg_q; since v12, spread only, weights fit on the training seasons plus 2013-2016). Anything else is rejected by the code.
# New signals come from the owner or the weekly researcher, by pull request the owner approves. Each needs a
# football reason; no known betting angles or situational spots (A3.5).
signals:
- id: off-success
  kind: team
  side: offense
  num:
    succ: 1
  den: plays
  halflife: 8
  carry: 0.5
  reason: Success rate is a steadier read of an offense than points or yards.
- id: def-success
  kind: team
  side: defense
  num:
    succ: 1
  den: plays
  halflife: 8
  carry: 0.5
  reason: 'Success rate allowed: how often a defense lets opponents stay on schedule.'
- id: off-pass-epa
  kind: team
  side: offense
  num:
    pass_epa: 1
  den: pass_plays
  halflife: 8
  carry: 0.5
  reason: Passing efficiency is the most stable and predictive part of offense.
- id: def-pass-epa
  kind: team
  side: defense
  num:
    pass_epa: 1
  den: pass_plays
  halflife: 8
  carry: 0.5
  reason: Pass defense efficiency matters more than run defense in modern football.
- id: off-early-epa
  kind: team
  side: offense
  num:
    early_epa: 1
  den: early_plays
  halflife: 8
  carry: 0.5
  reason: Early-down efficiency shows a team's real offense with less third-down noise.
- id: off-turnover-epa
  kind: team
  side: offense
  num:
    epa: 1
    noto_epa: -1
  den: plays
  halflife: 8
  carry: 0.5
  reason: 'EPA lost to turnovers per play: turnovers are noisy and tend to even out, so recent turnover luck may mislead the
    rating.'
- id: def-turnover-epa
  kind: team
  side: defense
  num:
    epa: 1
    noto_epa: -1
  den: plays
  halflife: 8
  carry: 0.5
  reason: 'Takeaway EPA per play by the defense: forced turnovers are partly luck and regress.'
- id: off-finishing
  kind: team
  side: offense
  num:
    points: 1
    epa: -1
  den: null
  halflife: 8
  carry: 0.5
  reason: 'Points scored beyond what EPA explains (red-zone finishing, short fields): partly luck that may not repeat.'
- id: off-comp-epa
  kind: team
  side: offense
  num:
    comp_epa: 1
  den: comp_plays
  halflife: 8
  carry: 0.5
  reason: Efficiency while the game is in doubt, without garbage-time stats.
- id: off-pace
  kind: team
  side: offense
  num:
    plays: 1
  den: null
  halflife: 8
  carry: 0.5
  reason: 'Plays per game: faster offenses create more scoring chances.'
  markets:
  - total
- id: off-seconds-per-play
  kind: team
  side: offense
  num:
    top_seconds: 1
  den: plays
  halflife: 8
  carry: 0.5
  reason: 'Seconds of possession per play: tempo, which drives how many possessions a game has.'
  markets:
  - total
- id: rest-diff
  kind: schedule
  field: rest_diff
  reason: Extra days of rest help recovery and preparation.
- id: bye-diff
  kind: schedule
  field: off_bye_diff
  reason: Coming off a bye means extra rest and game-planning time.
- id: short-week-diff
  kind: schedule
  field: short_week_diff
  reason: Short weeks (Thursday games) limit recovery and preparation.
- id: travel-diff
  kind: schedule
  field: travel_diff
  reason: Long trips cost the travelling team rest and routine.
- id: div-game
  kind: schedule
  field: div_game
  reason: Division rivals know each other well, which may narrow the home edge.
- id: qb-change
  kind: qb_change
  reason: A new starting quarterback changes a team more than any other player.
- id: def-finishing
  kind: team
  side: defense
  num:
    points: 1
    epa: -1
  den: null
  halflife: 8
  carry: 0.5
  reason: 'Points allowed beyond what EPA allowed explains (red-zone stands, short fields given up): red-zone defense is
    one of the least stable parts of defense from year to year, so it is partly luck that may not repeat.'
- id: def-early-epa
  kind: team
  side: defense
  num:
    early_epa: 1
  den: early_plays
  halflife: 8
  carry: 0.5
  reason: 'Early-down EPA allowed per play: defenses that win first and second down force obvious passing downs, and
    early-down efficiency is steadier than third-down results.'
- id: inj-qb-out
  kind: injury
  field: qb_out
  reason: 'Last game''s starting quarterback is out (injury report Out/Doubtful, or inactive / on a reserve list that
    week): the quarterback matters more than any other player, and the DeVig injury study (research/injuries/) found
    a missing starter worth about 3.8 points in game results.'
- id: inj-regulars-out
  kind: injury
  field: reg_out
  reason: 'How many regular starters (half the snaps or more in recent games) are out: depth charts thin out and
    backups are worse, which public injury-adjusted ratings (e.g. nfelo, FiveThirtyEight) account for.'
- id: inj-regulars-q
  kind: injury
  field: reg_q
  reason: 'How many regular starters are listed Questionable: players who do play are often limited, a smaller and
    less certain version of the same effect.'
# 2026-10-28 (Constitution v13): who is missing, by playing time. Share of each team's recent snaps held by players its final injury
# report listed Out or Doubtful (research/lab/availability.py; 2013 on, 0 before). Ratings built from recent games
# already include players who have been out for weeks; these read the new absences the ratings have not seen yet.
- id: out-off
  kind: availability
  field: out_off
  reason: An offense missing regular players this week is weaker than its recent games, which it played with them.
- id: out-def
  kind: availability
  field: out_def
  reason: A defense missing regular players this week is weaker than its recent games, which it played with them.
- id: out-ol
  kind: availability
  field: out_ol
  markets: [spread]
  reason: Offensive lines work as a unit; a missing starter forces a backup and new assignments next to him.
- id: out-skill
  kind: availability
  field: out_skill
  markets: [spread]
  reason: Missing receivers and backs narrow what the passing game can do and who the defense must cover.
- id: out-front
  kind: availability
  field: out_front
  markets: [spread]
  reason: Missing linemen and linebackers weaken the pass rush and run defense, which drive opponents' efficiency.
- id: out-db
  kind: availability
  field: out_db
  markets: [spread]
  reason: Missing cornerbacks and safeties expose the pass defense, the most important part of defense.
