# Research Lab search menu, SOCCER (Constitution v16 Part F, A3.3c). Every round scores, in this order, up to
# search.max_new_per_round configurations not scored before: the grid below (all combinations, in order), then
# the focus combinations, the neighbours of the 30 best per market, learned and random samples (seeded by
# round), then blends of the best. Adding a value or a family here is how an idea joins the search: free,
# since search scores are not attempts. No known betting angles (A3.5, F6).
# SOCCER: one market, the home team wins in 90 minutes (F3). The models rate teams in goals and turn that into a home
# win chance fit on the training season (2019-20): never Elo's own expected score, which counts a draw as half a win
# (F3; the code refuses prob: elo). Seed ideas (F6): (a) plain Elo on results, club-Elo style (draw = half a win in
# the ratings, home edge, offseason reversion); (b) Elo with a goal-difference multiplier, SRS / least-squares goal
# margins, opponent-adjusted goals for / against.
families:
- name: Elo win chance
  type: elo_ml
  market: moneyline
  fixed:
    mean: 1505
    playoff_mult: 1.0
    bye_rest_days: 13
    hfa_seasons: 3
    qb: none
    qb_alpha: 0.1
    qb_elo_per_value: 3.3
    qb_new_below_avg: 10
    nfelo_log_base: 10
    bye_elo: 0
    travel_elo_per_1000mi: 0
    market_resist: 0.0
    revert_center: none
    elo_per_point: 100
  grid:
    k:
    - 10
    - 15
    - 20
    - 25
    - 32
    hfa_elo:
    - 30
    - 50
    - 70
    - 90
    revert:
    - 0.1
    - 0.2
    - 0.3333
    - 0.5
    mov:
    - none
    - '538'
    hfa_mode:
    - fixed
    - rolling
    prob:
    - fit
    market_blend:
    - 0.0
- name: SRS win chance
  type: srs_ml
  market: moneyline
  fixed: {}
  grid:
    hfa_pts:
    - 0.2
    - 0.3
    - 0.4
