# Research Lab candidate elo-market -- registered before it runs (Constitution A3). Never edit after it has run.
id: elo-market
name: + Learn from the market line
market: spread
family: Elo family
parent: elo-base
reason: 'Let ratings learn from the market: after each game, update against a 50/50 blend of the Elo spread and the closing
  line instead of the Elo spread alone. nfelo regresses toward the market; its exact formula is not in its public code, so
  this uses a plain 50/50 blend.'
source: nfelo's public code (greerreNFL/nfelo, config nfelo_v4.3.1) (idea; blend weight is ours)
model:
  type: elo
  params:
    k: 20
    hfa_elo: 65
    revert: 0.3333333333333333
    revert_center: none
    mean: 1505
    elo_per_point: 25
    mov: none
    bye_elo: 0
    travel_elo_per_1000mi: 0
    playoff_mult: 1.0
    qb: none
    hfa_mode: fixed
    market_blend: 0.5
    market_resist: 0.0
    bye_rest_days: 13
    hfa_seasons: 3
    qb_alpha: 0.1
    qb_elo_per_value: 3.3
    qb_new_below_avg: 10
    nfelo_log_base: 10
