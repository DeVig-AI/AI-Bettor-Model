# Research Lab candidate elo-hfa-trend -- registered before it runs (Constitution A3). Never edit after it has run.
id: elo-hfa-trend
name: + Home field that changes over time
market: spread
family: Elo family
parent: elo-base
reason: 'Home-field advantage has shrunk over the years: use the average home margin of the previous three seasons instead
  of a fixed 65 Elo.'
source: nfelo uses a season-by-season home-field table; this is a simple version of the same idea
model:
  type: elo
  params:
    k: 20
    hfa_elo: 65
    revert: 0.3333333333333333
    revert_center: none
    mean: 1505
    elo_per_point: 25
    mov: none
    bye_elo: 0
    travel_elo_per_1000mi: 0
    playoff_mult: 1.0
    qb: none
    hfa_mode: rolling
    market_blend: 0.0
    market_resist: 0.0
    bye_rest_days: 13
    hfa_seasons: 3
    qb_alpha: 0.1
    qb_elo_per_value: 3.3
    qb_new_below_avg: 10
    nfelo_log_base: 10
