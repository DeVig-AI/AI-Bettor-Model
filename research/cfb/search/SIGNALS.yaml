# Research Lab signal library, college football (Constitution v9 A3.3e). Each signal is tested by the search on top of the
# menu's signal_bases (alone, then in pairs and trios of the best), weights fit on the training seasons only.
# Allowed: kind team (columns: plays, epa, points, and comp_plays / comp_epa = the same with garbage time excluded (CFB data has no other columns)), schedule (none (CFB data has no rest or travel)), qb_change. Anything else is rejected by the code.
# New signals come from the owner or the weekly researcher, by pull request the owner approves. Each needs a
# football reason; no known betting angles or situational spots (A3.5).
signals:
- id: off-ppa
  kind: team
  side: offense
  num:
    epa: 1
  den: plays
  halflife: 6
  carry: 0.4
  reason: 'Offensive PPA per play: efficiency is steadier than points.'
- id: def-ppa
  kind: team
  side: defense
  num:
    epa: 1
  den: plays
  halflife: 6
  carry: 0.4
  reason: PPA per play allowed by the defense.
- id: off-finishing
  kind: team
  side: offense
  num:
    points: 1
    epa: -1
  den: null
  halflife: 6
  carry: 0.4
  reason: 'Points beyond what PPA explains: finishing drives and short fields are partly luck.'
- id: off-pace
  kind: team
  side: offense
  num:
    plays: 1
  den: null
  halflife: 6
  carry: 0.4
  reason: 'Plays per game: tempo drives the number of possessions.'
  markets:
  - total
- id: def-finishing
  kind: team
  side: defense
  num:
    points: 1
    epa: -1
  den: null
  halflife: 6
  carry: 0.4
  reason: 'Points allowed beyond what PPA allowed explains: red-zone stands and short fields given up are partly luck
    and tend to even out.'
- id: off-points-per-play
  kind: team
  side: offense
  num:
    points: 1
  den: plays
  halflife: 6
  carry: 0.4
  reason: 'Points per play (tempo-free scoring, as in public college analytics): college tempos vary widely, so points
    per game overrate fast offenses and underrate slow ones.'
- id: def-points-per-play
  kind: team
  side: defense
  num:
    points: 1
  den: plays
  halflife: 6
  carry: 0.4
  reason: 'Points allowed per opponent play: a tempo-free read of a defense, which points allowed per game blurs with
    how many snaps its own offense''s tempo hands the opponent.'
- id: off-comp-ppa
  kind: team
  side: offense
  num:
    comp_epa: 1
  den: comp_plays
  halflife: 6
  carry: 0.4
  reason: 'Offensive PPA per play with garbage time removed: college blowouts are common, and plays against backups
    in a decided game say little about how good an offense is.'
- id: def-comp-ppa
  kind: team
  side: defense
  num:
    comp_epa: 1
  den: comp_plays
  halflife: 6
  carry: 0.4
  reason: 'PPA per play allowed with garbage time removed: a defense resting starters late in a blowout gives up
    yards that do not reflect its strength.'
- id: off-garbage-ppa
  kind: team
  side: offense
  num:
    epa: 1
    comp_epa: -1
  den: null
  halflife: 6
  carry: 0.4
  reason: 'PPA a team piles up in garbage time each game: it inflates points-based ratings (SRS, Elo margins) without
    saying much about the next close game, so it may be overrated by them.'

- id: def-pace
  kind: team
  side: defense
  num:
    plays: 1
  den: null
  halflife: 6
  carry: 0.4
  reason: 'Plays the defense faces per game: defenses that get off the field quickly (or face fast offenses) shape how
    many possessions a game has, which drives the total.'
  markets:
  - total
