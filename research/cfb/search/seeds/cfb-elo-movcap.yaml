# Research Lab CFB candidate cfb-elo-movcap -- registered before it runs (Constitution A3, Part C). Never edit after it has run.
id: cfb-elo-movcap
name: + Margin cap at 28 (with MOV)
market: spread
family: Elo family
parent: cfb-elo-mov
reason: College blowouts run up the score against overmatched teams; cap the margin the multiplier sees at 28 points, as margin-capped
  rating systems do.
source: Margin caps used by public rating systems (e.g. the BCS-era computer rankings); 538's Elo rules otherwise
model:
  type: elo
  params:
    k: 25
    hfa_elo: 70
    revert: 0.3333333333333333
    revert_center: none
    mean: 1500
    elo_per_point: 25
    mov: '538'
    bye_elo: 0
    travel_elo_per_1000mi: 0
    playoff_mult: 1.0
    qb: none
    hfa_mode: fixed
    market_blend: 0.0
    market_resist: 0.0
    bye_rest_days: 13
    hfa_seasons: 3
    qb_alpha: 0.1
    qb_elo_per_value: 3.3
    qb_new_below_avg: 10
    nfelo_log_base: 10
    returning: none
    returning_k: 0.5
    returning_mid: 0.5
    mov_cap: 28
