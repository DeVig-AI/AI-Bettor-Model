# Research Lab CFB candidate cfb-elo-base -- registered before it runs (Constitution A3, Part C). Never edit after it has run.
id: cfb-elo-base
name: Plain Elo
market: spread
family: Elo family
parent: null
reason: 'The simplest team rating: win/loss Elo with a fixed home edge (70 Elo, about 2.8 points), keeping 2/3 of last season''s
  rating, turned into a point spread at 25 Elo per point. Every rating idea for college football is measured against it.'
source: FiveThirtyEight's public Elo rules (fivethirtyeight/nfl-elo-game forecast.py, MIT), applied to FBS games
model:
  type: elo
  params:
    k: 25
    hfa_elo: 70
    revert: 0.3333333333333333
    revert_center: none
    mean: 1500
    elo_per_point: 25
    mov: none
    bye_elo: 0
    travel_elo_per_1000mi: 0
    playoff_mult: 1.0
    qb: none
    hfa_mode: fixed
    market_blend: 0.0
    market_resist: 0.0
    bye_rest_days: 13
    hfa_seasons: 3
    qb_alpha: 0.1
    qb_elo_per_value: 3.3
    qb_new_below_avg: 10
    nfelo_log_base: 10
    returning: none
    returning_k: 0.5
    returning_mid: 0.5
    mov_cap: null
