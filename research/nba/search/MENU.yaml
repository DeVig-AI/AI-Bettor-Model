- name: Team rating totals
  type: team_rating
  market: total
  fixed:
    metric: points
    pace: none
    league_window: 2460
  grid:
    halflife: &id001
    - 5
    - 10
    - 15
    - 20
    - 30
    - 40
    season_carry: &id002
    - 0.3
