# Research Lab search menu, NBA (Constitution v11 Part D, A3.3c). Every round scores, in this order, up to
# search.max_new_per_round configurations not scored before: the grid below (all combinations, in order), then
# the focus combinations, the neighbours of the 30 best per market, learned and random samples (seeded by
# round), then blends of the best. Adding a value or a family here is how an idea joins the search: free,
# since search scores are not attempts. No known betting angles (A3.5, D6).
families:
- name: Elo
  type: elo
  market: spread
  fixed:
    mean: 1505
    playoff_mult: 1.0
    bye_rest_days: 13
    hfa_seasons: 3
    qb: none
    qb_alpha: 0.1
    qb_elo_per_value: 3.3
    qb_new_below_avg: 10
    nfelo_log_base: 10
    bye_elo: 0
    travel_elo_per_1000mi: 0
    market_resist: 0.0
    revert_center: none
    elo_per_point: 28
  grid:
    k:
    - 10
    - 15
    - 20
    - 25
    - 30
    hfa_elo:
    - 50
    - 75
    - 100
    - 125
    revert:
    - 0.25
    - 0.4
    - 0.5
    mov:
    - none
    - '538'
    hfa_mode:
    - fixed
    - rolling
    market_blend:
    - 0.0
    - 0.25
    - 0.5
- name: SRS
  type: srs
  market: spread
  fixed: {}
  grid:
    hfa_pts:
    - 2.0
