# Cloudflare deploys this Worker from git with `npx wrangler deploy`, so these settings win over the dashboard.
name = "devig-alerts-timer"
main = "index.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"]
# secret: ALERTS_RUN_KEY (wrangler secret put ALERTS_RUN_KEY); never commit it

[observability.logs]
enabled = true
invocation_logs = true
