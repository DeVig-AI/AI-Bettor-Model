<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeVig sign in</title>
<meta http-equiv="refresh" content="2; url=/#profile">
<style>body{font-family:system-ui,sans-serif;background:#0f1115;color:#e8e8ea;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}a{color:#e0a243}</style>
</head>
<body>
<!-- Cloudflare Access guards only this page: reaching it means the email sign-in worked. Back to the app's profile,
     or to ?next= when it names a page on this site (a plain path, optionally with a #/page, never another site). -->
<p>Signed in. <a href="/#profile">Back to DeVig</a></p>
<script>
var next = new URLSearchParams(location.search).get("next") || "";
location.replace(/^\/[A-Za-z0-9_\/-]*(#\/[A-Za-z0-9_\/-]*)?$/.test(next) && !/^\/\//.test(next) ? next : "/#profile");
</script>
</body>
</html>
